name: Web checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vox_web_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Apply isolated consumer auth schema
        run: npm run db:migrate:consumer-auth
        env:
          VOX_WEB_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_web_auth_test
      - run: npm test
        env:
          VOX_WEB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_web_auth_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Consumer browser flows with isolated auth and Core fixtures
        run: npm run test:e2e:consumer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
